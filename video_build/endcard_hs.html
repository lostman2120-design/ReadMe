<!doctype html><html><head><meta charset="utf-8"/>
<style>
@font-face{font-family:'I';src:url('fonts/Inter-Regular.ttf');font-weight:400}
@font-face{font-family:'I';src:url('fonts/Inter-Medium.ttf');font-weight:500}
@font-face{font-family:'I';src:url('fonts/Inter-SemiBold.ttf');font-weight:600}
@font-face{font-family:'I';src:url('fonts/Inter-Bold.ttf');font-weight:700}
@font-face{font-family:'I';src:url('fonts/Inter-ExtraBold.ttf');font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'I',sans-serif}
body{background:linear-gradient(135deg,#0b1f33 0%,#0f2a45 55%,#103a5c 100%);color:#fff;
 display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:46px}
.li{width:74px;height:74px;border-radius:16px;background:#0a66c2;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:38px}
.arrow{font-size:38px;color:#8fb3d6}
.hs{width:74px;height:74px;border-radius:16px;background:#ff7a59;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px;color:#fff}
.bn{font-weight:700;font-size:30px;color:#cfe0f0;margin-left:8px;letter-spacing:.3px}
.flow{display:flex;align-items:center;gap:20px;margin-bottom:54px;font-weight:600;font-size:27px;color:#bcd3e8}
.chip{background:rgba(255,255,255,.07);border:1px solid rgba(143,179,214,.35);padding:14px 26px;border-radius:999px}
.sep{color:#5f86ad;font-size:24px}
.head{font-weight:800;font-size:60px;text-align:center;line-height:1.32;max-width:1300px}
.accent{color:#ff9c84}
.foot{margin-top:50px;font-weight:600;font-size:30px;color:#9db8d2;letter-spacing:.4px}
.ver{position:absolute;top:60px;font-weight:700;font-size:26px;color:#7fa3c6;letter-spacing:2px}
</style></head><body>
 <div class="ver">v0.2.3 · ICP-BASED SCORING</div>
 <div class="brand">
   <div class="li">in</div><div class="arrow">→</div><div class="hs">HS</div>
   <div class="bn">LinkedIn → HubSpot AI Assistant</div>
 </div>
 <div class="flow">
   <div class="chip">LinkedIn profile</div><div class="sep">→</div>
   <div class="chip">ICP Fit Score</div><div class="sep">→</div>
   <div class="chip">DM draft</div><div class="sep">→</div>
   <div class="chip">HubSpot context</div>
 </div>
 <div class="head">Built for HubSpot users doing<br/><span class="accent">manual LinkedIn prospecting</span></div>
 <div class="foot">$19/month · manual review · no auto-messaging</div>
</body></html>
