<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
@font-face{font-family:'Inter';src:url('fonts/Inter-Regular.ttf');font-weight:400}
@font-face{font-family:'Inter';src:url('fonts/Inter-SemiBold.ttf');font-weight:600}
@font-face{font-family:'Inter';src:url('fonts/Inter-Bold.ttf');font-weight:700}
@font-face{font-family:'Inter';src:url('fonts/Inter-ExtraBold.ttf');font-weight:800}
@font-face{font-family:'Inter';src:url('fonts/Inter-Black.ttf');font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif}
body{background:radial-gradient(900px 900px at 50% 22%,#10324a 0%,#0a1626 55%,#070d18 100%);
 color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 70px}
.lockup{display:flex;align-items:center;gap:22px;margin-bottom:54px}
.badge{display:flex;align-items:center;justify-content:center;height:104px;border-radius:24px;
 font-weight:800;font-size:46px;padding:0 30px}
.li{background:#0a66c2}.hs{background:#ff5c35}
.arrow{font-size:64px;color:#5eead4;font-weight:800}
h1{font-weight:900;font-size:118px;line-height:1.02;text-align:center;letter-spacing:-2px}
.grad{background:linear-gradient(90deg,#5eead4,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:46px;font-size:46px;color:#b9c6d6;font-weight:500;text-align:center;line-height:1.4}
.chips{display:flex;flex-direction:column;gap:28px;margin-top:74px;width:100%}
.chip{display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.06);
 border:1px solid rgba(94,234,212,.35);border-radius:999px;padding:30px 46px;font-size:46px;font-weight:700}
.dot{width:24px;height:24px;border-radius:50%;background:#5eead4;flex:none}
.cta{margin-top:86px;background:linear-gradient(90deg,#0f766e,#0ea5a0);color:#fff;font-weight:800;
 font-size:54px;padding:36px 0;border-radius:24px;width:100%;text-align:center;box-shadow:0 30px 70px rgba(14,165,160,.45)}
.safety{margin-top:54px;font-size:34px;color:#7e8da0;font-weight:600;text-align:center}
</style></head>
<body>
 <div class="lockup">
   <div class="badge li">in</div><div class="arrow">→</div><div class="badge hs">HubSpot</div>
 </div>
 <h1>Built for<br/><span class="grad">LinkedIn +<br/>HubSpot</span><br/>users.</h1>
 <div class="sub">Analyze profiles, score leads,<br/>and sync to your CRM — in one click.</div>
 <div class="chips">
   <div class="chip"><span class="dot"></span>AI Lead Scoring</div>
   <div class="chip"><span class="dot"></span>1-click HubSpot sync</div>
   <div class="chip"><span class="dot"></span>Zero copy-paste</div>
 </div>
 <div class="cta">Add it to your workflow</div>
 <div class="safety">No auto-messaging · No crawling · User-controlled</div>
</body></html>
