<!doctype html>
<html lang="ja"><head><meta charset="utf-8"/>
<style>
@font-face{font-family:'NotoJP';src:url('fonts/NotoSansJP-Medium.otf');font-weight:500}
@font-face{font-family:'NotoJP';src:url('fonts/NotoSansJP-Bold.otf');font-weight:700}
@font-face{font-family:'NotoJP';src:url('fonts/NotoSansJP-Black.otf');font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'NotoJP',sans-serif}
body{background:radial-gradient(1300px 900px at 70% 25%,#214a73 0%,#13314e 55%,#0c2036 100%);
 color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.brand{display:flex;align-items:center;gap:24px;margin-bottom:30px}
.mark{width:96px;height:96px;border-radius:22px;background:#1d4e7a;display:flex;align-items:center;
 justify-content:center;font-weight:900;font-size:42px;letter-spacing:1px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.bname{font-weight:900;font-size:72px;letter-spacing:.5px}
.bsub{font-weight:500;font-size:30px;color:#9fc0dd;margin-top:6px}
.tag{margin-top:30px;font-weight:700;font-size:40px;color:#eaf2fa;text-align:center;line-height:1.4}
.accent{color:#5fcaae}
.cta{margin-top:54px;background:#5fcaae;color:#0c2036;font-weight:900;font-size:42px;
 padding:26px 70px;border-radius:16px;box-shadow:0 22px 55px rgba(95,202,174,.45)}
.foot{margin-top:42px;font-weight:500;font-size:28px;color:#8fb0cc;letter-spacing:.5px}
.safe{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:flex;gap:18px}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(95,202,174,.4);border-radius:999px;
 padding:14px 28px;font-weight:700;font-size:26px;color:#dCEbf6}
</style></head>
<body>
 <div class="safe">
   <div class="pill">多言語対応</div>
   <div class="pill">危険な返信をしない安全設計</div>
   <div class="pill">スタッフ確認に自動振り分け</div>
 </div>
 <div class="brand">
   <div class="mark">SR</div>
   <div><div class="bname">StayReply AI</div><div class="bsub">多言語問い合わせ一次対応AI</div></div>
 </div>
 <div class="tag">多言語問い合わせ対応を、<span class="accent">小さく・安全に</span>始める。</div>
 <div class="cta">無料デモ受付中</div>
 <div class="foot">小規模ホテル・旅館・民泊・ゲストハウス向け</div>
</body></html>
