<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
@font-face{font-family:'Inter';src:url('fonts/Inter-Regular.ttf');font-weight:400}
@font-face{font-family:'Inter';src:url('fonts/Inter-SemiBold.ttf');font-weight:600}
@font-face{font-family:'Inter';src:url('fonts/Inter-Bold.ttf');font-weight:700}
@font-face{font-family:'Inter';src:url('fonts/Inter-ExtraBold.ttf');font-weight:800}
@font-face{font-family:'Inter';src:url('fonts/Inter-Black.ttf');font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif}
body{background:radial-gradient(1200px 800px at 70% 20%,#10324a 0%,#0a1626 55%,#070d18 100%);
 color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lockup{display:flex;align-items:center;gap:26px;margin-bottom:30px}
.badge{display:flex;align-items:center;justify-content:center;height:88px;border-radius:20px;
 font-weight:800;font-size:38px;padding:0 26px;letter-spacing:.5px}
.li{background:#0a66c2}
.hs{background:#ff5c35}
.arrow{font-size:52px;color:#5eead4;font-weight:800}
h1{font-weight:900;font-size:96px;line-height:1.02;text-align:center;letter-spacing:-1px}
.grad{background:linear-gradient(90deg,#5eead4,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:26px;font-size:38px;color:#b9c6d6;font-weight:500;text-align:center}
.chips{display:flex;gap:20px;margin-top:48px}
.chip{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);
 border:1px solid rgba(94,234,212,.35);border-radius:999px;padding:18px 30px;font-size:30px;font-weight:700}
.dot{width:16px;height:16px;border-radius:50%;background:#5eead4}
.cta{margin-top:58px;background:linear-gradient(90deg,#0f766e,#0ea5a0);color:#fff;font-weight:800;
 font-size:38px;padding:24px 54px;border-radius:16px;box-shadow:0 24px 60px rgba(14,165,160,.45)}
.safety{margin-top:40px;font-size:24px;color:#7e8da0;font-weight:600;letter-spacing:.4px}
</style></head>
<body>
 <div class="lockup">
   <div class="badge li">in</div>
   <div class="arrow">→</div>
   <div class="badge hs">HubSpot</div>
 </div>
 <h1>Built for <span class="grad">LinkedIn + HubSpot</span><br/>users.</h1>
 <div class="sub">Analyze profiles, score leads, and sync to your CRM — in one click.</div>
 <div class="chips">
   <div class="chip"><span class="dot"></span>AI Lead Scoring</div>
   <div class="chip"><span class="dot"></span>1-click HubSpot sync</div>
   <div class="chip"><span class="dot"></span>Zero copy-paste</div>
 </div>
 <div class="cta">Add it to your workflow</div>
 <div class="safety">No auto-messaging&nbsp;&nbsp;·&nbsp;&nbsp;No crawling&nbsp;&nbsp;·&nbsp;&nbsp;User-controlled</div>
</body></html>
