<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chameleon Survivors</title>
<style>
  :root { --bg:#0d1b14; --accent:#7CFC9B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",sans-serif;
    color:#eafff0; -webkit-tap-highlight-color:transparent; user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#102a1c; touch-action:none; image-rendering:pixelated; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:18px; text-align:center; padding:24px;
    background:rgba(8,18,12,.82); backdrop-filter:blur(3px); }
  .hidden { display:none !important; }
  h1 { font-size:clamp(28px,7vw,56px); letter-spacing:2px; color:var(--accent);
    text-shadow:0 0 18px rgba(124,252,155,.5); }
  .sub { opacity:.8; max-width:520px; line-height:1.6; font-size:15px; }
  button { font:inherit; font-size:18px; font-weight:700; cursor:pointer; border:none;
    padding:14px 30px; border-radius:14px; background:var(--accent); color:#06120b;
    box-shadow:0 6px 0 #3fa05f, 0 10px 24px rgba(0,0,0,.4); transition:transform .06s; }
  button:active { transform:translateY(3px); box-shadow:0 3px 0 #3fa05f; }
  .cards { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; max-width:760px; }
  .card { width:200px; background:#16341f; border:2px solid #2c6b3f; border-radius:16px;
    padding:18px; cursor:pointer; transition:transform .08s, border-color .08s; text-align:left; }
  .card:hover, .card.sel { transform:translateY(-4px); border-color:var(--accent); }
  .card .ico { font-size:34px; }
  .card .name { font-weight:800; margin:6px 0 4px; color:var(--accent); }
  .card .desc { font-size:13px; opacity:.82; line-height:1.45; }
  .card .lvl { font-size:11px; opacity:.6; margin-top:8px; }
  .stat { font-size:13px; opacity:.85; }
  .pill { display:inline-block; background:#16341f; border:1px solid #2c6b3f;
    padding:4px 10px; border-radius:999px; font-size:12px; margin:2px; }
  .hint { font-size:12px; opacity:.55; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="title" class="overlay">
    <h1>🦎 CHAMELEON<br>SURVIVORS</h1>
    <div class="sub">迫りくる虫の群れを、伸びる舌で食べ尽くせ。<br>
      生き延びてレベルアップ、自分だけのビルドを完成させろ。</div>
    <div>
      <span class="pill">移動: WASD / 矢印 / ドラッグ</span>
      <span class="pill">攻撃: 自動</span>
      <span class="pill">P: 一時停止</span>
      <span class="pill">M: 消音</span>
    </div>
    <button id="startBtn">▶ ゲーム開始</button>
    <div class="hint" id="bestHint"></div>
  </div>

  <div id="levelup" class="overlay hidden">
    <h1 id="luTitle" style="font-size:clamp(22px,5vw,38px)">LEVEL UP!</h1>
    <div class="sub" id="luSub">強化を1つ選べ</div>
    <div class="cards" id="choiceCards"></div>
  </div>

  <div id="gameover" class="overlay hidden">
    <h1 style="color:#ff7b7b">GAME OVER</h1>
    <div class="sub" id="goStats"></div>
    <button id="retryBtn">↻ もう一度</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Chameleon Survivors — single-file HTML5 prototype
   ヴァンサバ系: 自動攻撃 / 群れ / XP / レベルアップ強化
   ============================================================ */
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");

// ---- viewport ----
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;   // crisp upscaled pixel sprites
}
window.addEventListener("resize", resize);
resize();

// ---- helpers ----
const rand = (a, b) => a + Math.random() * (b - a);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx*dx + dy*dy; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

// ---- input ----
const keys = {};
addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
let pointer = { active:false, x:0, y:0 };
function ppos(e){ const t = e.touches ? e.touches[0] : e; return { x:t.clientX, y:t.clientY }; }
cv.addEventListener("pointerdown", e => { pointer.active = true; const p = ppos(e); pointer.x = p.x; pointer.y = p.y; });
cv.addEventListener("pointermove", e => { if(!pointer.active) return; const p = ppos(e); pointer.x = p.x; pointer.y = p.y; });
addEventListener("pointerup", () => pointer.active = false);

// ---- audio (WebAudio, no assets): SFX + procedural BGM ----
const Audio = (() => {
  let actx = null, master = null, sfxGain = null, musicGain = null, muted = false;
  let musicOn = false, mstep = 0, nextTime = 0, mtimer = null;
  function ensure() {
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 1; master.connect(actx.destination);
    sfxGain = actx.createGain(); sfxGain.gain.value = 0.35; sfxGain.connect(master);
    musicGain = actx.createGain(); musicGain.gain.value = 0.0; musicGain.connect(master);
  }
  function blip(freq, dur, type = "square", vol = 1, slide = 0, dest) {
    if (muted || !actx) return;
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxGain); o.start(t); o.stop(t + dur + 0.02);
  }
  // ---- procedural BGM: chip groove, minor pentatonic ----
  const TEMPO = 112, STEP = 60 / TEMPO / 4;            // 16th note
  // one bar = 16 steps. roots change each 4 steps (a small i-VI-III-VII feel)
  const ROOT = [110,110,110,110, 87.31,87.31,87.31,87.31, 130.81,130.81,130.81,130.81, 98,98,98,98];
  const LEAD = [0,7,12,15, 3,10,7,3, 0,12,10,7, 5,7,12,7]; // semitone offsets over 220Hz base
  function mnote(freq, dur, type, vol) {
    const t = nextTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + dur + 0.02);
  }
  function playStep(s) {
    const root = ROOT[s];
    if (s % 4 === 0) mnote(root / 2, STEP * 3.4, "triangle", 0.5);          // bass
    if (s % 4 === 0) mnote(55, 0.12, "sine", 0.6);                          // kick
    const lead = 220 * Math.pow(2, LEAD[s] / 12);
    if (s % 2 === 0) mnote(lead, STEP * 1.6, "square", 0.16);              // lead
    if (s % 2 === 1) mnote(7000, 0.02, "square", 0.05);                    // hat
  }
  function scheduler() {
    if (!musicOn) return;
    while (nextTime < actx.currentTime + 0.12) { playStep(mstep); nextTime += STEP; mstep = (mstep + 1) % 16; }
    mtimer = setTimeout(scheduler, 40);
  }
  return {
    resume(){ ensure(); if (actx.state === "suspended") actx.resume(); },
    startMusic(){ ensure(); if (!musicOn) { musicOn = true; mstep = 0; nextTime = actx.currentTime + 0.1;
      musicGain.gain.setTargetAtTime(muted ? 0 : 0.22, actx.currentTime, 0.5); scheduler(); } },
    toggle(){ muted = !muted; if (musicGain) musicGain.gain.setTargetAtTime(muted ? 0 : 0.22, actx.currentTime, 0.05); return muted; },
    isMuted(){ return muted; },
    tongue(){ blip(620, 0.06, "sawtooth", 0.14, -260); },
    hit(){ blip(440, 0.06, "triangle", 0.18, -240); blip(900, 0.025, "square", 0.06, -300); },
    kill(){ blip(523, 0.08, "triangle", 0.18, 130); blip(784, 0.08, "triangle", 0.11, 120); },
    hurt(){ blip(140, 0.22, "sawtooth", 0.3, -90); },
    // uplifting ascending major arpeggio fanfare
    levelup(){ const seq = [523, 659, 784, 1047];
      seq.forEach((f, i) => setTimeout(() => { blip(f, 0.15, "square", 0.22); blip(f*2, 0.1, "triangle", 0.05); }, i*70)); },
    pick(){ blip(880, 0.08, "triangle", 0.18, 220); },
    // brighter, triumphant treasure jingle
    chest(){ const seq = [523, 659, 784, 1047, 1319];
      seq.forEach((f, i) => setTimeout(() => { blip(f, 0.16, "triangle", 0.24); blip(f*1.5, 0.08, "square", 0.06); }, i*75)); },
    shield(){ blip(330,0.08,"square",0.2,400); blip(660,0.12,"triangle",0.12,-200); },
    heal(){ const seq = [523, 784, 1047];
      seq.forEach((f, i) => setTimeout(() => blip(f, 0.18, "sine", 0.2), i*100)); },
    boom(){ blip(90,0.4,"sawtooth",0.35,-50); blip(200,0.3,"square",0.2,-160); },
  };
})();

// ============================================================
//  Game state
// ============================================================
let game;
function newGame() {
  return {
    state: "play",           // play | levelup | over
    paused: false,
    hitstop: 0,              // brief time-freeze on big hits
    time: 0,                 // seconds survived
    cam: { x:0, y:0 },
    player: {
      x:0, y:0, r:18, speed:185, hp:100, maxhp:100,
      facing:{x:1,y:0},
      iframe:0,
      // weapon: tongue
      tongueCd:0, tongueRate:0.7, tongueRange:240, tongueDmg:14, tongueWidth:14,
      tongues:1,            // number of simultaneous tongue strikes
      regen:0,
      xpMult:1,
      // equipment
      equip:{ head:null, body:null },
      mods:{ speed:1, atk:1, def:1, size:1, xp:1, regen:0, shield:false },
      shield:false, shieldCd:0,
      // anim
      tongueAnim:[],        // active tongue strikes for drawing
      chomp:0,              // eat animation timer
    },
    enemies: [],
    food: [],
    chests: [],
    particles: [],
    dmgText: [],
    level: 1, xp:0, xpNext: 5,
    kills: 0,
    spawnTimer: 0,
    chestTimer: 14,
    banner: null,            // { text, t }
    flash: 0,                // white screen flash (nuke)
    biome: pickBiome(),
    shake: 0,
    choices: [],
  };
}
function pickBiome() {
  const ks = Object.keys(BIOMES);
  return ks[(Math.random() * ks.length) | 0];
}

// ---- upgrade pool ----
const UPGRADES = [
  { id:"rate",  ico:"⚡", name:"舌の速さ", desc:"攻撃間隔 -15%",
    apply:p => p.tongueRate *= 0.85 },
  { id:"dmg",   ico:"🔥", name:"鋭い舌", desc:"ダメージ +30%",
    apply:p => p.tongueDmg *= 1.3 },
  { id:"range", ico:"📏", name:"伸びる舌", desc:"射程 +25%",
    apply:p => p.tongueRange *= 1.25 },
  { id:"multi", ico:"👅", name:"二枚舌", desc:"同時攻撃 +1",
    apply:p => p.tongues += 1 },
  { id:"width", ico:"💢", name:"極太の舌", desc:"舌が太くなり貫通力UP",
    apply:p => p.tongueWidth *= 1.5 },
  { id:"speed", ico:"🏃", name:"俊足", desc:"移動速度 +15%",
    apply:p => p.speed *= 1.15 },
  { id:"hp",    ico:"❤️", name:"頑丈", desc:"最大HP +30 & 全回復",
    apply:p => { p.maxhp += 30; p.hp = p.maxhp; } },
  { id:"regen", ico:"🌿", name:"再生", desc:"毎秒HP回復 +1.5",
    apply:p => p.regen += 1.5 },
  { id:"glutton",ico:"🍽️", name:"大食い", desc:"獲得経験値 +30%",
    apply:p => p.xpMult *= 1.3 },
];

function rollChoices() {
  const pool = UPGRADES.slice();
  const out = [];
  while (out.length < 3 && pool.length) {
    out.push(pool.splice((Math.random()*pool.length)|0, 1)[0]);
  }
  return out;
}

// ============================================================
//  Spawning
// ============================================================
const ENEMY_TYPES = {
  fly:       { r:12, hp:10,  speed:74,  dmg:6,  xp:1, color:"#9be36b", wob:true,  shape:"fly"       },
  butterfly: { r:13, hp:14,  speed:66,  dmg:7,  xp:2, color:"#e58ad6", wob:true,  shape:"butterfly" },
  bat:       { r:12, hp:18,  speed:128, dmg:9,  xp:2, color:"#8a7caa", wob:true,  shape:"bat"       },
  wasp:      { r:11, hp:18,  speed:120, dmg:9,  xp:2, color:"#f2d04b", wob:true,  shape:"wasp"      },
  beetle:    { r:16, hp:38,  speed:54,  dmg:12, xp:3, color:"#c98b3a", wob:false, shape:"beetle"    },
  zombie:    { r:18, hp:72,  speed:46,  dmg:16, xp:5, color:"#6fae57", wob:false, shape:"zombie"    },
  tank:      { r:26, hp:135, speed:38,  dmg:20, xp:8, color:"#b15de0", wob:false, shape:"tank"      },
};
function spawnEnemy() {
  const p = game.player;
  const ang = Math.random() * TAU;
  const d = Math.max(W, H) * 0.62 + 80;
  const t = game.time;
  // mix shifts toward tougher, weirder enemies over time
  const r = Math.random();
  let type;
  if      (t > 200 && r < 0.10) type = "tank";
  else if (t > 150 && r < 0.24) type = "zombie";
  else if (t > 70  && r < 0.38) type = "beetle";
  else if (t > 45  && r < 0.52) type = "bat";
  else if (t > 25  && r < 0.64) type = "wasp";
  else if (t > 12  && r < 0.74) type = "butterfly";
  else type = "fly";
  const base = ENEMY_TYPES[type];
  const hpScale = 1 + t / 185;
  game.enemies.push({
    type, x:p.x + Math.cos(ang)*d, y:p.y + Math.sin(ang)*d,
    r:base.r, hp:base.hp*hpScale, maxhp:base.hp*hpScale,
    speed:base.speed*(1 + t/520), dmg:base.dmg, xp:base.xp,
    color:base.color, wob:base.wob, hit:0, phase:Math.random()*TAU,
    kx:0, ky:0,
  });
}

// ============================================================
//  Update
// ============================================================
function damageEnemy(e, dmg, kx, ky) {
  e.hp -= dmg; e.hit = 0.12;
  // knockback scaled down for bigger enemies
  const kf = 0.55 * (18 / e.r);
  e.kx += kx * kf; e.ky += ky * kf;
  game.dmgText.push({ x:e.x, y:e.y - e.r, t:0.6, v:Math.round(dmg), crit:dmg>game.player.tongueDmg });
  for (let i = 0; i < 4; i++)
    game.particles.push({ x:e.x, y:e.y, vx:rand(-60,60)+kx*0.3, vy:rand(-60,60)+ky*0.3,
      t:rand(.2,.45), c:e.color, r:rand(1,3) });
  Audio.hit();
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  e.dead = true; game.kills++;
  Audio.kill();
  // leave an edible morsel that gets sucked into the chameleon's mouth
  game.food.push({ x:e.x, y:e.y, type:e.type, xp:e.xp, r:e.r*0.7, t:0, delay:rand(0,0.08) });
  for (let i = 0; i < 6; i++)
    game.particles.push({ x:e.x, y:e.y, vx:rand(-100,100), vy:rand(-100,100),
      t:rand(.2,.45), c:e.color, r:rand(1.5,3) });
}
// chameleon mouth position (front of facing direction)
function mouthPos() {
  const p = game.player;
  const off = p.r * p.mods.size * 1.1;
  return { x: p.x + p.facing.x * off, y: p.y + p.facing.y * off };
}

function fireTongue() {
  const p = game.player;
  // target the nearest N enemies in range
  const inRange = [];
  const R2 = p.tongueRange * p.tongueRange;
  for (const e of game.enemies) {
    const d2 = dist2(p.x, p.y, e.x, e.y);
    if (d2 <= R2) inRange.push({ e, d2 });
  }
  if (!inRange.length) return false;
  Audio.tongue();
  inRange.sort((a, b) => a.d2 - b.d2);
  const n = Math.min(p.tongues, inRange.length);
  for (let i = 0; i < n; i++) {
    const tgt = inRange[i].e;
    const ang = Math.atan2(tgt.y - p.y, tgt.x - p.x);
    const len = Math.min(p.tongueRange, Math.sqrt(inRange[i].d2) + tgt.r);
    // hit everything along the tongue line (piercing)
    const ex = p.x + Math.cos(ang)*len, ey = p.y + Math.sin(ang)*len;
    const crit = Math.random() < 0.15;
    const dmg = p.tongueDmg * p.mods.atk * (crit ? 2 : 1);
    for (const e of game.enemies) {
      if (e.dead) continue;
      if (pointSegDist2(e.x, e.y, p.x, p.y, ex, ey) <= (p.tongueWidth + e.r) ** 2) {
        damageEnemy(e, dmg, Math.cos(ang)*200, Math.sin(ang)*200);
      }
    }
    p.tongueAnim.push({ ang, len, t:0.18, max:0.18 });
    game.shake = Math.min(game.shake + 2, 8);
    if (crit) game.hitstop = Math.max(game.hitstop, 0.05);
  }
  return true;
}
function pointSegDist2(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx*dx + dy*dy || 1;
  let t = ((px - ax)*dx + (py - ay)*dy) / l2;
  t = clamp(t, 0, 1);
  const cx = ax + t*dx, cy = ay + t*dy;
  return dist2(px, py, cx, cy);
}

function gainXP(n) {
  game.xp += n;
  while (game.xp >= game.xpNext) {
    game.xp -= game.xpNext;
    game.level++;
    game.xpNext = Math.round(game.xpNext * 1.32 + 3);
    Audio.levelup();
    openLevelUp();
  }
}

// ---- chests ----
function spawnChest() {
  const p = game.player;
  const ang = Math.random() * TAU;
  const d = rand(260, 480);
  game.chests.push({ x:p.x + Math.cos(ang)*d, y:p.y + Math.sin(ang)*d, r:16, bob:0 });
}
function banner(text) { game.banner = { text, t:2.2 }; }
// ---- equipment (head / body slots, dropped from chests) ----
// stats: speed/atk/def are multipliers, size scales the chameleon,
// xp is an XP multiplier, regen adds HP/s, shield gives a recharging block.
// visual drives the cosmetic overlay drawn on the chameleon.
const EQUIPMENT = [
  // head
  { slot:"head", ico:"🪖", name:"鉄兜",     desc:"防御力UP（被ダメ -25%）", stats:{ def:0.75 }, visual:"helmet" },
  { slot:"head", ico:"🪶", name:"俊足の羽帽", desc:"移動速度 +20%",          stats:{ speed:1.2 }, visual:"feather" },
  { slot:"head", ico:"🛡️", name:"不屈のヘルム", desc:"被弾を1回無効化（12秒で回復）", stats:{ shield:true }, visual:"crown" },
  { slot:"head", ico:"🎯", name:"狙撃ゴーグル", desc:"攻撃力 +20%",          stats:{ atk:1.2 }, visual:"goggle" },
  // body
  { slot:"body", ico:"🦾", name:"戦の鎧",   desc:"攻撃力 +35%",            stats:{ atk:1.35 }, visual:"armor" },
  { slot:"body", ico:"🐢", name:"重甲羅",   desc:"被ダメ -35%／速度 -8%",  stats:{ def:0.65, speed:0.92 }, visual:"shell" },
  { slot:"body", ico:"🎈", name:"巨大化スーツ", desc:"巨大化（攻撃 +20%・当たり判定大）", stats:{ size:1.5, atk:1.2 }, visual:"giant" },
  { slot:"body", ico:"🌿", name:"再生コート", desc:"毎秒HP回復 +2.5",        stats:{ regen:2.5 }, visual:"leaf" },
];
function rollEquip() {
  const pool = EQUIPMENT.slice(), out = [];
  while (out.length < 3 && pool.length) out.push(pool.splice((Math.random()*pool.length)|0, 1)[0]);
  return out;
}
function recomputeMods() {
  const p = game.player;
  const m = { speed:1, atk:1, def:1, size:1, xp:1, regen:0, shield:false };
  for (const slot of ["head", "body"]) {
    const it = p.equip[slot]; if (!it) continue;
    const s = it.stats;
    if (s.speed) m.speed *= s.speed;
    if (s.atk)   m.atk   *= s.atk;
    if (s.def)   m.def   *= s.def;
    if (s.size)  m.size  *= s.size;
    if (s.xp)    m.xp    *= s.xp;
    if (s.regen) m.regen += s.regen;
    if (s.shield) m.shield = true;
  }
  p.mods = m;
}
function equipItem(it) {
  const p = game.player;
  p.equip[it.slot] = it;
  recomputeMods();
  if (p.mods.shield && !p.shield) { p.shield = true; p.shieldCd = 0; }
  banner(`${it.ico} ${it.name} を装備！`);
}
function openChest(c) {
  for (let i = 0; i < 18; i++)
    game.particles.push({ x:c.x, y:c.y, vx:rand(-160,160), vy:rand(-200,40), t:rand(.3,.7), c:"#ffd24b", r:rand(1.5,3.5) });
  // ~50% heal, ~50% equipment choice
  if (Math.random() < 0.5) {
    const p = game.player, heal = Math.round(p.maxhp * 0.5);
    p.hp = Math.min(p.maxhp, p.hp + heal);
    banner(`❤️ HP +${heal} 回復！`); Audio.heal();
  } else {
    Audio.chest();
    showChoices("🎁 おたから！", "装備を1つ選んで身につけろ", rollEquip(),
      it => `<div class="ico">${it.ico}</div><div class="name">${it.name}</div>`+
            `<div class="desc">${it.desc}</div><div class="lvl">${it.slot === "head" ? "頭" : "胴"}装備</div>`,
      equipItem);

function update(dt) {
  const p = game.player;
  game.time += dt;

  // ---- movement ----
  let mx = 0, my = 0;
  if (keys["a"] || keys["arrowleft"]) mx -= 1;
  if (keys["d"] || keys["arrowright"]) mx += 1;
  if (keys["w"] || keys["arrowup"]) my -= 1;
  if (keys["s"] || keys["arrowdown"]) my += 1;
  if (pointer.active) {
    const wx = pointer.x - W/2, wy = pointer.y - H/2;
    if (Math.hypot(wx, wy) > 18) { mx = wx; my = wy; }
  }
  const ml = Math.hypot(mx, my);
  if (ml > 0) {
    mx /= ml; my /= ml;
    const sp = p.speed * p.mods.speed;
    p.x += mx * sp * dt; p.y += my * sp * dt;
    p.facing.x = mx; p.facing.y = my;
  }

  // ---- camera ----
  game.cam.x += (p.x - game.cam.x) * Math.min(1, dt*8);
  game.cam.y += (p.y - game.cam.y) * Math.min(1, dt*8);

  // ---- regen / timers / shield ----
  const regen = p.regen + p.mods.regen;
  if (regen) p.hp = Math.min(p.maxhp, p.hp + regen * dt);
  if (p.iframe > 0) p.iframe -= dt;
  if (p.chomp > 0) p.chomp -= dt;
  if (p.mods.shield && !p.shield) { p.shieldCd -= dt; if (p.shieldCd <= 0) p.shield = true; }

  // ---- weapon ---- (only consume cooldown when an enemy is actually hit,
  // so the tongue reacts the instant something enters range)
  if (p.tongueCd > 0) p.tongueCd -= dt;
  if (p.tongueCd <= 0 && fireTongue()) p.tongueCd = p.tongueRate;
  for (let i = p.tongueAnim.length - 1; i >= 0; i--) {
    p.tongueAnim[i].t -= dt;
    if (p.tongueAnim[i].t <= 0) p.tongueAnim.splice(i, 1);
  }

  // ---- spawn ---- (gentler ramp + hard cap on on-screen count)
  game.spawnTimer -= dt;
  const cap = Math.min(210, 75 + game.time * 0.4);
  const spawnInterval = Math.max(0.32, 1.05 - game.time/380);
  if (game.spawnTimer <= 0 && game.enemies.length < cap) {
    const batch = 1 + Math.floor(game.time / 80);
    for (let i = 0; i < batch; i++) spawnEnemy();
    game.spawnTimer = spawnInterval;
  }

  // ---- chests ----
  game.chestTimer -= dt;
  if (game.chestTimer <= 0 && game.chests.length < 2) { spawnChest(); game.chestTimer = 22; }
  for (const c of game.chests) {
    c.bob += dt * 3;
    if (dist2(c.x, c.y, p.x, p.y) < (p.r + c.r + 4) ** 2) { openChest(c); c.taken = true; }
  }
  game.chests = game.chests.filter(c => !c.taken);

  // ---- banner / flash ----
  if (game.banner) { game.banner.t -= dt; if (game.banner.t <= 0) game.banner = null; }
  if (game.flash > 0) game.flash = Math.max(0, game.flash - dt * 1.6);

  // ---- enemies ----
  for (const e of game.enemies) {
    if (e.dead) continue;
    let ang = Math.atan2(p.y - e.y, p.x - e.x);
    e.phase += dt * 4;
    if (e.wob) ang += Math.sin(e.phase) * 0.5;
    e.x += Math.cos(ang) * e.speed * dt;
    e.y += Math.sin(ang) * e.speed * dt;
    // knockback decay
    e.x += e.kx * dt; e.y += e.ky * dt;
    e.kx *= 0.82; e.ky *= 0.82;
    if (e.hit > 0) e.hit -= dt;
    // collide with player
    const rr = (e.r + p.r * p.mods.size);
    if (dist2(e.x, e.y, p.x, p.y) < rr*rr && p.iframe <= 0) {
      if (p.mods.shield && p.shield) {        // shield blocks the hit
        p.shield = false; p.shieldCd = 12; p.iframe = 0.8; game.shake = 8; Audio.shield();
      } else {
        p.hp -= e.dmg * p.mods.def; p.iframe = 0.6; game.shake = 10; Audio.hurt();
        for (let i = 0; i < 10; i++)
          game.particles.push({ x:p.x, y:p.y, vx:rand(-150,150), vy:rand(-150,150), t:rand(.2,.5), c:"#ff7b7b", r:rand(1,3) });
        if (p.hp <= 0) { gameOver(); return; }
      }
    }
  }
  // separation so enemies don't fully stack
  for (let i = 0; i < game.enemies.length; i++) {
    const a = game.enemies[i]; if (a.dead) continue;
    for (let j = i+1; j < game.enemies.length; j++) {
      const b = game.enemies[j]; if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const rr = a.r + b.r;
      const d2 = dx*dx + dy*dy;
      if (d2 < rr*rr && d2 > 0.01) {
        const d = Math.sqrt(d2); const push = (rr - d) * 0.5;
        const nx = dx/d, ny = dy/d;
        a.x -= nx*push; a.y -= ny*push; b.x += nx*push; b.y += ny*push;
      }
    }
  }
  game.enemies = game.enemies.filter(e => !e.dead);

  // ---- food (倒した敵を口に吸い込んで食べる) ----
  const mp = mouthPos();
  for (const f of game.food) {
    if (f.delay > 0) { f.delay -= dt; continue; }
    f.t += dt;
    const ang = Math.atan2(mp.y - f.y, mp.x - f.x);
    const speed = 220 + f.t * 1100;          // accelerate toward the mouth
    f.x += Math.cos(ang) * speed * dt; f.y += Math.sin(ang) * speed * dt;
    if (dist2(f.x, f.y, mp.x, mp.y) < (14 + p.r * p.mods.size * 0.3) ** 2) {
      f.eaten = true;
      gainXP(Math.max(1, Math.round(f.xp * p.xpMult * p.mods.xp)));
      p.chomp = 0.15; Audio.pick();
      for (let i = 0; i < 3; i++)
        game.particles.push({ x:mp.x, y:mp.y, vx:rand(-50,50), vy:rand(-50,50), t:rand(.15,.3), c:"#ffe08a", r:rand(1,2.5) });
    }
  }
  game.food = game.food.filter(f => !f.eaten);

  // ---- particles / dmg text ----
  for (const pt of game.particles) { pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vx*=0.92; pt.vy*=0.92; pt.t -= dt; }
  game.particles = game.particles.filter(pt => pt.t > 0);
  for (const d of game.dmgText) { d.t -= dt; d.y -= 26*dt; }
  game.dmgText = game.dmgText.filter(d => d.t > 0);

  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt*30);
}

// ============================================================
//  World theming + sprites
// ============================================================
// grounds are earthy/dark so the (often green) enemies stay readable
const BIOMES = {
  forest: { ground:"#2a2418", grid:"rgba(120,90,50,0.10)",  density:0.40, name:"森の平野" },
  rocky:  { ground:"#322b22", grid:"rgba(210,180,140,0.07)", density:0.34, name:"岩地"     },
  cyber:  { ground:"#0c0f1c", grid:"rgba(70,200,255,0.10)",  density:0.26, name:"サイバー基地" },

// stable per-cell pseudo-random
function hash(x, y) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) * f, 0, 255) | 0;
  const g = clamp(((n >> 8) & 255) * f, 0, 255) | 0;
  const b = clamp((n & 255) * f, 0, 255) | 0;
  return `rgb(${r},${g},${b})`;
}
function mkCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function ell(x, cx, cy, rx, ry) { x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, TAU); x.fill(); }

// sprites drawn small then upscaled with nearest-neighbor = chunky pixels
let PLAYER_SPRITE, ENEMY_SPRITES = {}, GEAR_SPRITES = {};
const ENEMY_BR = 16, ENEMY_CS = 56;     // body radius / canvas size for creatures
const GEAR_W = 38, GEAR_H = 40;         // gear baked at player-sprite resolution
function buildSprites() {
  // ---- chameleon ----
  const w = 38, h = 28; PLAYER_SPRITE = mkCanvas(w, h);
  const x = PLAYER_SPRITE.getContext("2d");
  const OUT = "#13301c", BODY = "#5fd17a", LITE = "#9bf0a8", DARK = "#39884f";
  // tail spiral (outline + fill)
  x.lineCap = "round";
  x.strokeStyle = OUT; x.lineWidth = 7; x.beginPath(); x.arc(9, 16, 5.5, Math.PI*0.15, Math.PI*1.85); x.stroke();
  x.strokeStyle = BODY; x.lineWidth = 4; x.beginPath(); x.arc(9, 16, 5.5, Math.PI*0.15, Math.PI*1.85); x.stroke();
  // legs
  x.fillStyle = OUT; x.fillRect(15, 19, 4, 6); x.fillRect(23, 19, 4, 7);
  // body + head outline
  x.fillStyle = OUT; ell(x, 20, 15, 13, 10); ell(x, 30, 12, 7.5, 7);
  // body + head fill
  x.fillStyle = BODY; ell(x, 20, 15, 11.5, 8.5); ell(x, 30, 12, 6, 5.5);
  // lower shadow + upper highlight (volume)
  x.fillStyle = DARK; ell(x, 20, 19, 10, 3.4);
  x.fillStyle = LITE; ell(x, 17, 11, 6.5, 3);
  // back crest
  x.fillStyle = DARK;
  for (let i = 0; i < 4; i++) { x.beginPath(); x.moveTo(13 + i*4, 7); x.lineTo(15 + i*4, 3); x.lineTo(17 + i*4, 7); x.fill(); }
  // eye turret
  x.fillStyle = OUT; ell(x, 32, 9.5, 4.5, 4.5);
  x.fillStyle = "#eafff0"; ell(x, 32, 9.5, 3, 3);
  x.fillStyle = "#06120b"; ell(x, 33.2, 9.5, 1.4, 1.4);

  // ---- enemies: distinct silhouettes per shape ----
  for (const [type, base] of Object.entries(ENEMY_TYPES)) {
    const cv2 = mkCanvas(ENEMY_CS, ENEMY_CS); ENEMY_SPRITES[type] = cv2;
    const g2 = cv2.getContext("2d");
    g2.translate(ENEMY_CS/2, ENEMY_CS/2);    // center origin
    drawCreature(g2, base.shape, base.color, ENEMY_BR);
  }

  // ---- gear: baked at player-sprite resolution so it matches the pixel look ----
  for (const v of ["helmet","feather","crown","goggle","armor","shell","giant","leaf"]) {
    const gc = mkCanvas(GEAR_W, GEAR_H); GEAR_SPRITES[v] = gc;
    const gx = gc.getContext("2d");
    gx.translate(GEAR_W/2, GEAR_H/2);
    drawGearShape(gx, v);
  }
}

// ---- creature drawing helpers (center origin) ----
function sphere(g, cx, cy, r, color) {
  g.fillStyle = "#06120b"; ell(g, cx, cy, r + 1.5, r + 1.5);
  const grad = g.createRadialGradient(cx - r*0.35, cy - r*0.4, 2, cx, cy, r);
  grad.addColorStop(0, shade(color, 1.45)); grad.addColorStop(0.6, color); grad.addColorStop(1, shade(color, 0.6));
  g.fillStyle = grad; ell(g, cx, cy, r, r);
}
function eyes(g, cx, cy, r, sp) {
  g.fillStyle = "#06120b"; ell(g, cx - sp, cy, r, r); ell(g, cx + sp, cy, r, r);
  g.fillStyle = "#fff"; ell(g, cx - sp + r*0.4, cy - r*0.4, r*0.4, r*0.4); ell(g, cx + sp + r*0.4, cy - r*0.4, r*0.4, r*0.4);

function rrect(g, x, y, w, h, r) {

  g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); g.fill();
}
function drawCreature(g, shape, color, R) {
  g.lineCap = "round";

    g.fillStyle = "rgba(255,255,255,0.30)"; ell(g, -7, -9, 7, 4); ell(g, 7, -9, 7, 4);
    sphere(g, 0, 0, R*0.85, color); eyes(g, 0, -2, 2.4, 4);

    g.fillStyle = shade(color, 0.7); ell(g, -12, -7, 10, 8); ell(g, 12, -7, 10, 8); ell(g, -10, 8, 8, 7); ell(g, 10, 8, 8, 7);
    g.fillStyle = color; ell(g, -12, -7, 7, 6); ell(g, 12, -7, 7, 6); ell(g, -10, 8, 5.5, 5); ell(g, 10, 8, 5.5, 5);
    g.fillStyle = "rgba(255,255,255,0.55)"; ell(g, -12, -7, 2.6, 2.6); ell(g, 12, -7, 2.6, 2.6);
    g.fillStyle = "#2a1f2e"; ell(g, 0, 0, 3, 11);

    g.moveTo(-1, -9); g.quadraticCurveTo(-5, -16, -8, -15); g.moveTo(1, -9); g.quadraticCurveTo(5, -16, 8, -15); g.stroke();
    g.fillStyle = "#2a1f2e"; ell(g, -8, -15, 1.7, 1.7); ell(g, 8, -15, 1.7, 1.7);
    eyes(g, 0, -4, 1.5, 2);
  } else if (shape === "bat") {
    g.fillStyle = "#2f2a45";
    for (const dir of [-1, 1]) { g.beginPath(); g.moveTo(0, -2);
      g.lineTo(dir*23, -9); g.lineTo(dir*19, 2); g.lineTo(dir*24, 7);
      g.lineTo(dir*15, 6); g.lineTo(dir*13, 11); g.lineTo(dir*7, 6); g.lineTo(0, 7); g.closePath(); g.fill(); }
    g.fillStyle = "#2f2a45";
    g.beginPath(); g.moveTo(-5, -9); g.lineTo(-7, -17); g.lineTo(-1, -11); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(5, -9); g.lineTo(7, -17); g.lineTo(1, -11); g.closePath(); g.fill();
    sphere(g, 0, 0, R*0.7, color);
    g.fillStyle = "#ff5d5d"; ell(g, -3.6, -1, 2, 2); ell(g, 3.6, -1, 2, 2);
    g.fillStyle = "#fff"; ell(g, -3, -1.6, 0.8, 0.8); ell(g, 4.2, -1.6, 0.8, 0.8);

    sphere(g, 0, 0, R*0.82, color);
    g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(-R*0.8, -3.2, R*1.6, 2.6); g.fillRect(-R*0.8, 2, R*1.6, 2.6);

    g.fillStyle = shade(color, 0.6);

    sphere(g, 0, 0, R, color);

    g.strokeStyle = "#06120b"; g.lineWidth = 2; g.beginPath(); g.moveTo(-9, -8); g.lineTo(-3, -5); g.moveTo(9, -8); g.lineTo(3, -5); g.stroke();
  }
}
function blit(spr, wx, wy, scale, flipX) {
  ctx.save(); ctx.translate(wx, wy);

}
function groundShadow(wx, wy, r) {
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.beginPath(); ctx.ellipse(wx, wy + r*0.6, r*0.95, r*0.4, 0, 0, TAU); ctx.fill();

function drawBackground(camx, camy) {
  const b = BIOMES[game.biome];
  ctx.fillStyle = b.ground; ctx.fillRect(camx, camy, W, H);
  // soft dirt/terrain blotches for texture (cheap, deterministic)
  const PC = 84;
  const px0 = Math.floor(camx/PC) - 1, py0 = Math.floor(camy/PC) - 1;
  const px1 = Math.floor((camx+W)/PC) + 1, py1 = Math.floor((camy+H)/PC) + 1;
  for (let cy = py0; cy <= py1; cy++) for (let cx = px0; cx <= px1; cx++) {
    const h = hash(cx*5+7, cy*9+3);
    ctx.fillStyle = h < 0.5 ? "rgba(0,0,0,0.10)" : "rgba(255,255,255,0.025)";
    const bx = cx*PC + hash(cx+9, cy)*PC, by = cy*PC + hash(cx, cy+9)*PC;

  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
    if (hash(cx, cy) > b.density) continue;
    const px = cx*CELL + hash(cx + 31, cy*7 + 5) * CELL;

function drawProp(biome, x, y, v) {
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath(); ctx.ellipse(x, y + 10, 14, 5, 0, 0, TAU); ctx.fill();
  if (biome === "forest") {
    if (v < 0.6) { // pine
      ctx.fillStyle = "#5a3a22"; ctx.fillRect(x - 2, y + 4, 4, 8);
      for (let i = 0; i < 3; i++) {
        const yy = y + 6 - i*8, ww = 14 - i*3;
        ctx.fillStyle = i === 2 ? "#3f9c57" : "#2f7d44";

      }
    } else { // bush
      ctx.fillStyle = "#2c7a40";
      ell(ctx, x - 5, y + 4, 7, 6); ell(ctx, x + 5, y + 4, 7, 6); ell(ctx, x, y, 8, 7);
      ctx.fillStyle = "#3f9c57"; ell(ctx, x - 2, y - 2, 4, 3);
    }
  } else if (biome === "rocky") {
    const g = ctx.createLinearGradient(x, y - 10, x, y + 10);
    g.addColorStop(0, "#8a8278"); g.addColorStop(1, "#544e45");
    ctx.fillStyle = g;
    ctx.beginPath();
    const sz = v < 0.5 ? 13 : 8;
    ctx.moveTo(x - sz, y + 6); ctx.lineTo(x - sz*0.6, y - sz*0.6); ctx.lineTo(x + sz*0.3, y - sz);
    ctx.lineTo(x + sz, y - sz*0.2); ctx.lineTo(x + sz*0.7, y + 7); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.beginPath();
    ctx.moveTo(x + sz*0.3, y - sz); ctx.lineTo(x + sz, y - sz*0.2); ctx.lineTo(x + sz*0.2, y - sz*0.3); ctx.closePath(); ctx.fill();
  } else { // cyber
    ctx.fillStyle = "rgba(20,40,60,0.6)";
    ctx.fillRect(x - 12, y - 12, 24, 24);
    ctx.strokeStyle = v < 0.5 ? "#27e0ff" : "#9b6bff"; ctx.lineWidth = 1.5;
    ctx.strokeRect(x - 12, y - 12, 24, 24);
    ctx.fillStyle = ctx.strokeStyle; ctx.globalAlpha = 0.5 + 0.4*Math.sin(game.time*3 + v*10);
    ctx.fillRect(x - 3, y - 3, 6, 6); ctx.globalAlpha = 1;
  }
}
function drawChest(c) {
  const pulse = 0.5 + 0.5*Math.sin(c.bob);
  groundShadow(c.x, c.y + 4, 16);
  ctx.save(); ctx.translate(c.x, c.y - Math.abs(Math.sin(c.bob))*2);
  // glow
  ctx.fillStyle = `rgba(255,210,75,${0.18 + 0.12*pulse})`;
  ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.fill();
  // box
  ctx.fillStyle = "#7a4a1c"; ctx.fillRect(-13, -4, 26, 14);
  ctx.fillStyle = "#9c6228"; ctx.fillRect(-13, -12, 26, 9);
  ctx.fillStyle = "#ffd24b"; ctx.fillRect(-2, -12, 4, 22);  // latch band
  ctx.strokeStyle = "#3a2410"; ctx.lineWidth = 2; ctx.strokeRect(-13, -12, 26, 22);
  ctx.restore();
}

// ============================================================
//  Render
// ============================================================
function render() {
  ctx.clearRect(0, 0, W, H);
  const sx = game.shake ? rand(-game.shake, game.shake) : 0;
  const sy = game.shake ? rand(-game.shake, game.shake) : 0;
  const camx = game.cam.x - W/2 + sx;
  const camy = game.cam.y - H/2 + sy;
  ctx.save();
  ctx.translate(-camx, -camy);

  drawBackground(camx, camy);

  // chests
  for (const c of game.chests) drawChest(c);

  // enemies
  for (const e of game.enemies) drawEnemy(e);

  // food morsels flying to the mouth (draw above enemies)
  for (const f of game.food) {
    if (f.delay > 0) continue;
    blit(ENEMY_SPRITES[f.type], f.x, f.y, f.r / ENEMY_BR, false);
  }

  // particles
  for (const pt of game.particles) {
    ctx.globalAlpha = clamp(pt.t*2, 0, 1);
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, TAU);
    ctx.fillStyle = pt.c; ctx.fill();
  }
  ctx.globalAlpha = 1;

  // tongues
  const p = game.player;
  for (const t of p.tongueAnim) {
    const prog = 1 - (t.t / t.max);
    const reach = t.len * Math.sin(prog * Math.PI); // out then back
    const ex = p.x + Math.cos(t.ang)*reach, ey = p.y + Math.sin(t.ang)*reach;
    ctx.strokeStyle = "#ff5d7e"; ctx.lineCap = "round";
    ctx.lineWidth = p.tongueWidth*1.4;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex, ey, p.tongueWidth*0.9, 0, TAU);
    ctx.fillStyle = "#ff7b95"; ctx.fill();
  }

  drawPlayer();

  // damage text
  ctx.textAlign = "center"; ctx.font = "bold 15px sans-serif";
  for (const d of game.dmgText) {
    ctx.globalAlpha = clamp(d.t*2, 0, 1);
    ctx.fillStyle = d.crit ? "#ffd24b" : "#ffffff";
    ctx.fillText(d.v, d.x, d.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // nuke flash
  if (game.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${clamp(game.flash,0,1)*0.6})`; ctx.fillRect(0, 0, W, H); }

  // off-screen chest markers
  for (const c of game.chests) {
    const sxp = c.x - camx, syp = c.y - camy;
    if (sxp < 0 || sxp > W || syp < 0 || syp > H) {
      const ang = Math.atan2(c.y - game.cam.y, c.x - game.cam.x);
      const mx = W/2 + Math.cos(ang) * Math.min(W, H) * 0.42;
      const my = H/2 + Math.sin(ang) * Math.min(W, H) * 0.42;
      ctx.fillStyle = "#ffd24b"; ctx.font = "20px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("🎁", mx, my); ctx.textBaseline = "alphabetic";
    }
  }

  // boon banner
  if (game.banner) {
    ctx.globalAlpha = clamp(game.banner.t, 0, 1);
    ctx.textAlign = "center"; ctx.font = "bold 30px sans-serif";
    ctx.fillStyle = "#06120b"; ctx.fillText(game.banner.text, W/2 + 2, H*0.3 + 2);
    ctx.fillStyle = "#ffd24b"; ctx.fillText(game.banner.text, W/2, H*0.3);
    ctx.globalAlpha = 1;
  }

  // low-HP red vignette warning
  const hpr = p.hp / p.maxhp;
  if (hpr < 0.35) {
    const pulse = 0.25 + 0.15 * Math.sin(game.time * 6);
    const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.6);
    g.addColorStop(0, "rgba(255,0,40,0)");
    g.addColorStop(1, `rgba(255,0,40,${pulse * (1 - hpr/0.35)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  drawHUD();

  if (game.paused) {
    ctx.fillStyle = "rgba(8,18,12,.6)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#7CFC9B"; ctx.textAlign = "center"; ctx.font = "bold 40px sans-serif";
    ctx.fillText("PAUSED", W/2, H/2);
    ctx.font = "14px sans-serif"; ctx.fillStyle = "#eafff0";
    ctx.fillText("P で再開", W/2, H/2 + 32);
  }
}

function drawGrid(camx, camy, color) {
  const s = 64;
  ctx.strokeStyle = color || "rgba(124,252,155,0.06)"; ctx.lineWidth = 1;
  const x0 = Math.floor(camx / s) * s, y0 = Math.floor(camy / s) * s;
  ctx.beginPath();
  for (let x = x0; x < camx + W + s; x += s) { ctx.moveTo(x, camy); ctx.lineTo(x, camy + H); }
  for (let y = y0; y < camy + H + s; y += s) { ctx.moveTo(camx, y); ctx.lineTo(camx + W, y); }
  ctx.stroke();
}

function drawEnemy(e) {
  const bob = e.wob ? Math.sin(e.phase)*2 : 0;
  groundShadow(e.x, e.y + e.r*0.4, e.r);
  const spr = ENEMY_SPRITES[e.type];
  blit(spr, e.x, e.y + bob, e.r / ENEMY_BR, false);
  if (e.hit > 0) {                          // white hit flash
    ctx.globalAlpha = clamp(e.hit / 0.12, 0, 1) * 0.8;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(e.x, e.y + bob, e.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // hp bar
  if (e.hp < e.maxhp) {
    const w = e.r*2;
    ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(e.x - w/2, e.y - e.r - 9, w, 4);
    ctx.fillStyle = "#7CFC9B"; ctx.fillRect(e.x - w/2, e.y - e.r - 9, w * clamp(e.hp/e.maxhp,0,1), 4);
  }
}

function drawPlayer() {
  const p = game.player;
  const sz = p.mods.size;
  const bob = Math.sin(game.time * 8) * 1.5;
  groundShadow(p.x, p.y + p.r*0.5*sz, p.r*sz);
  ctx.save();
  ctx.translate(p.x, p.y + bob);
  if (p.iframe > 0 && Math.floor(p.iframe*20) % 2) ctx.globalAlpha = 0.45;
  if (p.facing.x < 0) ctx.scale(-1, 1);                 // flip L/R, no rotation
  let s = (p.r * 2.7 * sz) / PLAYER_SPRITE.height;
  if (p.chomp > 0) s *= 1 + Math.sin((1 - p.chomp/0.15) * Math.PI) * 0.14;  // chomp pulse
  ctx.scale(s, s);
  const SW = PLAYER_SPRITE.width, SH = PLAYER_SPRITE.height;
  ctx.drawImage(PLAYER_SPRITE, -SW/2, -SH/2);
  // equipment overlays: baked dot-art sprites, upscaled with the body
  if (p.equip.body) ctx.drawImage(GEAR_SPRITES[p.equip.body.visual], -GEAR_W/2, -GEAR_H/2);
  if (p.equip.head) ctx.drawImage(GEAR_SPRITES[p.equip.head.visual], -GEAR_W/2, -GEAR_H/2);
  ctx.restore();
  // shield ring (screen space)
  if (p.mods.shield && p.shield) {
    ctx.strokeStyle = `rgba(120,200,255,${0.5 + 0.3*Math.sin(game.time*6)})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p.x, p.y + bob, p.r*sz + 7, 0, TAU); ctx.stroke();
  }
}
// equipment cosmetic, drawn at center origin (matches player content center).
// head/eye ≈ (+13,-3), body ≈ (+1,+1) in sprite-local coords.
function drawGearShape(g, visual) {
  switch (visual) {
    case "armor": g.fillStyle = "#c0392b"; ell(g, 1, 2, 9, 6);
      g.fillStyle = "#e05a4a"; g.fillRect(-6, -2, 14, 2.5);
      g.fillStyle = "#7a1f17"; g.fillRect(-6, 3, 14, 1.5); break;
    case "shell": g.fillStyle = "#7a4a1c"; ell(g, 1, -1, 11, 8);
      g.fillStyle = "#9c6228"; ell(g, -1, -2, 5, 4);
      g.strokeStyle = "#3a2410"; g.lineWidth = 1; g.beginPath(); g.ellipse(1, -1, 11, 8, 0, 0, TAU); g.stroke(); break;
    case "giant": g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 1.5;
      g.beginPath(); g.ellipse(2, 1, 14, 11, 0, 0, TAU); g.stroke(); break;
    case "leaf": g.fillStyle = "#2f9c4f";
      for (let i = -1; i <= 1; i++) { g.save(); g.translate(i*6, -6); g.rotate(i*0.4); ell(g, 0, 0, 4, 2.2); g.restore(); } break;
    case "helmet": g.fillStyle = "#9aa3ad"; g.beginPath(); g.arc(12, -4, 7, Math.PI, TAU); g.fill();
      g.fillStyle = "#c5ccd4"; g.fillRect(5, -4, 14, 2); break;
    case "feather": g.fillStyle = "#39d6ff"; g.beginPath();
      g.moveTo(9, -8); g.lineTo(17, -16); g.lineTo(13, -6); g.closePath(); g.fill(); break;
    case "crown": g.fillStyle = "#ffd24b"; g.beginPath();
      g.moveTo(7, -8); g.lineTo(9, -14); g.lineTo(12, -9); g.lineTo(15, -14); g.lineTo(17, -8); g.closePath(); g.fill(); break;
    case "goggle": g.fillStyle = "#222"; g.fillRect(8, -6, 12, 3);
      g.fillStyle = "#ff5d7e"; g.fillRect(13, -6, 4, 3); break;
  }
}

function drawHUD() {
  const p = game.player;
  // xp bar (top)
  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = "#39d6ff"; ctx.fillRect(0, 0, W * clamp(game.xp/game.xpNext,0,1), 10);
  // hp bar
  const hw = 200;
  ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(14, 22, hw, 16);
  ctx.fillStyle = "#ff5d7e"; ctx.fillRect(14, 22, hw * clamp(p.hp/p.maxhp,0,1), 16);
  ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 1; ctx.strokeRect(14, 22, hw, 16);
  ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "left";
  ctx.fillText(`HP ${Math.ceil(p.hp)}/${p.maxhp}`, 20, 34);
  // level + biome
  ctx.font = "bold 14px sans-serif";
  ctx.fillText(`Lv.${game.level}`, 14, 58);
  ctx.font = "11px sans-serif"; ctx.fillStyle = "rgba(234,255,240,.6)";
  ctx.fillText(`📍 ${BIOMES[game.biome].name}`, 14, 74);
  // timer (center)
  const m = Math.floor(game.time/60), s = Math.floor(game.time%60);
  ctx.textAlign = "center"; ctx.font = "bold 26px sans-serif"; ctx.fillStyle = "#eafff0";
  ctx.fillText(`${m}:${s.toString().padStart(2,"0")}`, W/2, 40);
  // kills (right)
  ctx.textAlign = "right"; ctx.font = "bold 14px sans-serif"; ctx.fillStyle = "#eafff0";
  ctx.fillText(`☠ ${game.kills}`, W - 14, 40);
  // equipped gear (right, under kills)
  ctx.font = "16px sans-serif";
  const gear = [p.equip.head, p.equip.body].filter(Boolean).map(it => it.ico).join(" ");
  if (gear) ctx.fillText(gear, W - 14, 64);
}

// ============================================================
//  Flow / UI
// ============================================================
const el = id => document.getElementById(id);
function show(id){ el(id).classList.remove("hidden"); }
function hide(id){ el(id).classList.add("hidden"); }

function start() {
  Audio.resume();               // unlock WebAudio on user gesture
  Audio.startMusic();           // BGM
  game = newGame();
  hide("title"); hide("gameover"); hide("levelup");
  game.state = "play";
}
function gameOver() {
  game.state = "over";
  const best = Math.max(Number(localStorage.getItem("cs_best")||0), Math.floor(game.time));
  localStorage.setItem("cs_best", best);
  const m = Math.floor(game.time/60), s = Math.floor(game.time%60);
  el("goStats").innerHTML =
    `生存 <b>${m}:${s.toString().padStart(2,"0")}</b> ／ 撃破 <b>${game.kills}</b> ／ Lv.<b>${game.level}</b><br>` +
    `<span class="pill">自己ベスト: ${Math.floor(best/60)}:${(best%60).toString().padStart(2,"0")}</span>`;
  show("gameover");
}
// generic 3-choice picker, shared by level-up and chests
function showChoices(title, sub, items, renderFn, onPick) {
  game.state = "choosing";
  game._choiceItems = items;
  game._onPick = onPick;
  el("luTitle").textContent = title;
  el("luSub").textContent = sub;
  const box = el("choiceCards"); box.innerHTML = "";
  items.forEach((it, i) => {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = renderFn(it);
    c.onclick = () => doPick(i);
    box.appendChild(c);
  });
  show("levelup");
}
function doPick(i) {
  const it = game._choiceItems[i];
  hide("levelup");
  game.state = "play";
  game._onPick(it);
}
function openLevelUp() {
  showChoices("LEVEL UP!", "強化を1つ選べ", rollChoices(),
    u => `<div class="ico">${u.ico}</div><div class="name">${u.name}</div><div class="desc">${u.desc}</div>`,
    u => u.apply(game.player));
}

el("startBtn").onclick = start;
el("retryBtn").onclick = start;
const best = Number(localStorage.getItem("cs_best")||0);
if (best > 0) el("bestHint").textContent =
  `自己ベスト: ${Math.floor(best/60)}:${(best%60).toString().padStart(2,"0")}`;

// keyboard: number keys to pick a choice
addEventListener("keydown", e => {
  if (game && game.state === "choosing") {
    const n = parseInt(e.key);
    if (n >= 1 && n <= game._choiceItems.length) doPick(n-1);
  }
});

// ============================================================
//  Loop
// ============================================================
buildSprites();
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 1/20); // clamp big frame gaps
  if (game && game.state === "play" && !game.paused) {
    if (game.hitstop > 0) game.hitstop -= dt;   // freeze sim, keep rendering
    else update(dt);
  }
  if (game) render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// pause / mute
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (game && game.state === "play" && (k === "p" || k === "escape")) game.paused = !game.paused;
  if (k === "m") Audio.toggle();
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden && game && game.state === "play") game.paused = true;
});
</script>
</body>
